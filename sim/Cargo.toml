[package]
name = "solace-sim"
version = "0.1.0"
edition = "2021"
description = "Wildfire spread simulation core using the Canadian FBP System"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true